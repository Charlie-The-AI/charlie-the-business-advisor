version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: charlie-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: charlie_advisor
      POSTGRES_USER: charlie_user
      POSTGRES_PASSWORD: secret_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U charlie_user -d charlie_advisor"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: charlie-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: charlie-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_NAME: "Charlie the Business Advisor"
      APP_ENV: local
      APP_KEY: base64:wJ5FvA8vN7m2p6l8K5q1z8c4y7x0u3r6T9s2e5g8b1M=
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: charlie_advisor
      DB_USERNAME: charlie_user
      DB_PASSWORD: secret_password
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      AI_PROVIDER: mock
      BILLING_GATEWAY: mock
    ports:
      - "8000:8000"
    command: php artisan serve --host=0.0.0.0 --port=8000

  queue-worker:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: charlie-queue-worker
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: charlie_advisor
      DB_USERNAME: charlie_user
      DB_PASSWORD: secret_password
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
    command: php artisan queue:work --tries=3 --timeout=120

  dashboard:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile.dashboard
    container_name: charlie-dashboard
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://api:8000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
